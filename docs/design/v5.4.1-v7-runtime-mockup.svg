      <stop offset="0" stop-color="#101017"/>
      <stop offset="1" stop-color="#171621"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e63ff"/>
      <stop offset="0.52" stop-color="#48d9ff"/>
      <stop offset="1" stop-color="#d16cff"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211b55"/>
      <stop offset="0.42" stop-color="#6a3ac1"/>
      <stop offset="1" stop-color="#1dd6d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
