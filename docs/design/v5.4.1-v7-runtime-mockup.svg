      .muted { font-family: "Google Sans", "Segoe UI", Arial, sans-serif; fill: #b9b4c4; }
      .small { font-family: "Google Sans", "Segoe UI", Arial, sans-serif; fill: #d7d2e0; font-size: 24px; }
      .label { font-family: "Google Sans", "Segoe UI", Arial, sans-serif; fill: #aaa4b7; font-size: 21px; letter-spacing: 1px; }
    </style>
  </defs>

