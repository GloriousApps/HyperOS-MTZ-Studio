name: Build & Release MTZ Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a public GitHub release'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Release tag, or signed artifact label for a private test build'
        required: false
        default: 'v4.6.2'
      release_name:
        description: 'Release Title'
        required: false
        default: 'HyperOS MTZ Studio v4.6.2'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore stable release signing key
        env:
          MTZ_RELEASE_KEYSTORE_BASE64: ${{ secrets.MTZ_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$MTZ_RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing.jks

      - name: Build Release APK
        env:
          MTZ_RELEASE_STORE_FILE: ${{ github.workspace }}/release-signing.jks
          MTZ_RELEASE_STORE_PASSWORD: ${{ secrets.MTZ_RELEASE_STORE_PASSWORD }}
          MTZ_RELEASE_KEY_ALIAS: ${{ secrets.MTZ_RELEASE_KEY_ALIAS }}
          MTZ_RELEASE_KEY_PASSWORD: ${{ secrets.MTZ_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine Tag and Title
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_name }}"
          else
            TAG="${{ github.ref_name }}"
            TITLE="HyperOS MTZ Studio ${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Prepare Release Asset
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.release_meta.outputs.tag }}"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/MTZ_Studio_${TAG}.apk"
          cd release-artifacts
          sha256sum "MTZ_Studio_${TAG}.apk" > "MTZ_Studio_${TAG}.apk.sha256"
          ls -la

      - name: Upload Signed Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTZ_Studio_${{ steps.release_meta.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: docs/release-notes-v4.6.2.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
